name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

env:
  OTEL_PAYLOAD_STORE: ${{ vars.OTEL_PAYLOAD_STORE || 'kv' }}
  OTEL_PAYLOAD_R2_DRAIN: ${{ vars.OTEL_PAYLOAD_R2_DRAIN || 'false' }}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate-deployment:
    name: Validate deployment
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Reject non-master manual deployments
        if: github.ref != 'refs/heads/master'
        run: |
          printf '%s\n' "Deployment is restricted to master; selected ref was ${GITHUB_REF}." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Validate proxy gateway configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_GATEWAY_ID: ${{ vars.CLOUDFLARE_AI_GATEWAY_ID || secrets.CLOUDFLARE_AI_GATEWAY_ID }}
        working-directory: workers
        run: |
          config_values="$(node ../scripts/parse-jsonc.mjs wrangler.proxy.jsonc)"
          gateway_id="${CLOUDFLARE_AI_GATEWAY_ID:-$(jq -r '.vars.AI_GATEWAY_ID // empty' <<<"$config_values")}"
          account_id="${CLOUDFLARE_ACCOUNT_ID:-$(jq -r '.vars.CF_ACCOUNT_ID // empty' <<<"$config_values")}"
          if [[ -z "$gateway_id" || "$gateway_id" == "replace-with-ai-gateway-id" ]]; then
            printf '%s\n' 'Set CLOUDFLARE_AI_GATEWAY_ID in GitHub secrets/variables (or AI_GATEWAY_ID in workers/wrangler.proxy.jsonc) before deploying.' >&2
            exit 1
          fi
          if [[ ! "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            printf '%s\n' 'Set a valid 32-character hex CLOUDFLARE_ACCOUNT_ID in GitHub secrets/variables or workers/wrangler.proxy.jsonc before deploying.' >&2
            exit 1
          fi

      - name: Validate OTel payload store selection
        run: |
          set -euo pipefail
          case "$OTEL_PAYLOAD_STORE" in
            kv|r2) ;;
            *) printf 'OTEL_PAYLOAD_STORE must be kv or r2, got %s\n' "$OTEL_PAYLOAD_STORE" >&2; exit 1 ;;
          esac
          case "$OTEL_PAYLOAD_R2_DRAIN" in
            true|false) ;;
            *) printf 'OTEL_PAYLOAD_R2_DRAIN must be exactly true or false, got %s\n' "$OTEL_PAYLOAD_R2_DRAIN" >&2; exit 1 ;;
          esac
          if [[ "$OTEL_PAYLOAD_STORE" == r2 && "$OTEL_PAYLOAD_R2_DRAIN" == true ]]; then
            printf '%s\n' 'OTEL_PAYLOAD_R2_DRAIN=true is redundant when OTEL_PAYLOAD_STORE=r2.' >&2
            exit 1
          fi

  apply-cloudflare-infrastructure:
    name: Apply OTel Cloudflare infrastructure
    runs-on: ubuntu-latest
    needs: validate-deployment
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_grafana_cloud_loki_url: ${{ secrets.GRAFANA_CLOUD_LOKI_URL }}
      TF_VAR_grafana_cloud_loki_username: ${{ secrets.GRAFANA_CLOUD_LOKI_USERNAME }}
      TF_VAR_grafana_cloud_access_policy_token: ${{ secrets.GRAFANA_CLOUD_ACCESS_POLICY_TOKEN }}
      TF_VAR_origin_secret: ${{ secrets.ORIGIN_SECRET }}
      TF_VAR_rsa_private_key_pem: ${{ secrets.RSA_PRIVATE_KEY_PEM }}
      TF_VAR_workers_subdomain: ${{ vars.WORKERS_SUBDOMAIN }}
      TF_VAR_logpush_dataset: ${{ vars.LOGPUSH_DATASET || 'ai_gateway_events' }}
      TF_VAR_worker_script_name: ${{ vars.WORKER_SCRIPT_NAME || 'graft-ai-aig-logpush' }}
      TF_VAR_logpush_job_name: ${{ vars.LOGPUSH_JOB_NAME || 'graft-ai-aig-logpush' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.10.0"
          terraform_wrapper: false

      - name: Apply Queue, DLQ, KV, and selected R2 resources
        working-directory: terraform
        run: |
          set -euo pipefail
          terraform init -input=false
          targets=(
            -target=cloudflare_queue.otel
            -target=cloudflare_queue.otel_dlq
            -target=cloudflare_workers_kv_namespace.otel_payloads
          )
          if [[ "$OTEL_PAYLOAD_STORE" == r2 || "$OTEL_PAYLOAD_R2_DRAIN" == true ]]; then
            targets+=(
              -target=cloudflare_r2_bucket.otel
              -target=cloudflare_r2_bucket_lifecycle.otel
            )
          fi
          terraform apply -input=false -auto-approve "${targets[@]}"

  deploy-otel-worker:
    name: Deploy dedicated OTel Worker
    runs-on: ubuntu-latest
    needs: [validate-deployment, apply-cloudflare-infrastructure]
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json

      - name: Install Worker dependencies
        working-directory: workers
        run: npm ci --ignore-scripts

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.10.0"
          terraform_wrapper: false

      - name: Render dedicated OTel Worker config
        working-directory: workers
        run: |
          set -euo pipefail
          terraform -chdir=../terraform init -input=false
          kv_namespace_id="$(terraform -chdir=../terraform output -raw otel_payload_kv_namespace_id)"
          render_args=(
            --payload-store "$OTEL_PAYLOAD_STORE"
            --kv-namespace-id "$kv_namespace_id"
            --output .wrangler/otel.generated.jsonc
          )
          if [[ "$OTEL_PAYLOAD_STORE" == r2 || "$OTEL_PAYLOAD_R2_DRAIN" == true ]]; then
            render_args+=(--include-r2-binding)
          fi
          node ../scripts/render-otel-worker-config.mjs "${render_args[@]}"

      - name: Sync dedicated OTel Worker secrets
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OTEL_INGEST_TOKEN: ${{ secrets.OTEL_INGEST_TOKEN }}
          OTEL_RATE_LIMIT_HMAC_KEY: ${{ secrets.OTEL_RATE_LIMIT_HMAC_KEY }}
          GRAFANA_CLOUD_OTLP_TRACES_URL: ${{ secrets.GRAFANA_CLOUD_OTLP_TRACES_URL }}
          GRAFANA_CLOUD_OTLP_METRICS_URL: ${{ secrets.GRAFANA_CLOUD_OTLP_METRICS_URL }}
          GRAFANA_CLOUD_OTLP_AUTHORIZATION: ${{ secrets.GRAFANA_CLOUD_OTLP_AUTHORIZATION }}
          GRAFANA_CLOUD_LOKI_URL: ${{ secrets.GRAFANA_CLOUD_LOKI_URL }}
          GRAFANA_CLOUD_LOKI_AUTHORIZATION: ${{ secrets.GRAFANA_CLOUD_LOKI_AUTHORIZATION }}
        run: |
          set -euo pipefail
          secret_names=(
            OTEL_INGEST_TOKEN
            OTEL_RATE_LIMIT_HMAC_KEY
            GRAFANA_CLOUD_OTLP_TRACES_URL
            GRAFANA_CLOUD_OTLP_METRICS_URL
            GRAFANA_CLOUD_OTLP_AUTHORIZATION
            GRAFANA_CLOUD_LOKI_URL
            GRAFANA_CLOUD_LOKI_AUTHORIZATION
          )
          missing=()
          for name in "${secret_names[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if ((${#missing[@]} > 0)); then
            printf 'Missing production secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          for name in "${secret_names[@]}"; do
            printf '%s' "${!name}" | npx wrangler secret put "$name" --config .wrangler/otel.generated.jsonc
          done

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers
          command: deploy --config .wrangler/otel.generated.jsonc

  deploy-proxy-worker:
    name: Deploy Proxy Worker
    runs-on: ubuntu-latest
    needs: validate-deployment
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json

      - name: Install Worker dependencies
        working-directory: workers
        run: npm ci --ignore-scripts

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers
          command: deploy --config wrangler.proxy.jsonc --var CF_ACCOUNT_ID:${{ secrets.CLOUDFLARE_ACCOUNT_ID }} --var AI_GATEWAY_ID:${{ vars.CLOUDFLARE_AI_GATEWAY_ID || secrets.CLOUDFLARE_AI_GATEWAY_ID }}

  deploy-ollama-worker:
    name: Deploy Ollama Cloud Worker
    runs-on: ubuntu-latest
    needs: validate-deployment
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json

      - name: Install Worker dependencies
        working-directory: workers
        run: npm ci --ignore-scripts

      - name: Sync Worker Secrets
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GRAFANA_CLOUD_PROMETHEUS_URL: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_URL || vars.GRAFANA_CLOUD_PROMETHEUS_URL }}
          GRAFANA_CLOUD_PROMETHEUS_USERNAME: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_USERNAME || vars.GRAFANA_CLOUD_PROMETHEUS_USERNAME }}
          GRAFANA_CLOUD_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_CLOUD_ACCESS_POLICY_TOKEN || secrets.GRAFANA_CLOUD_API_KEY }}
          OLLAMA_CLOUD_RESET_ANCHOR_ISO: ${{ vars.OLLAMA_CLOUD_RESET_ANCHOR_ISO || secrets.OLLAMA_CLOUD_RESET_ANCHOR_ISO }}
        run: |
          set -e
          sync_secret() {
            local name="$1"
            local val="$2"
            if [[ -n "$val" ]]; then
              printf '%s' "$val" | npx wrangler secret put "$name" --config wrangler.ollama.jsonc
            fi
          }
          sync_secret "GRAFANA_CLOUD_PROMETHEUS_URL" "$GRAFANA_CLOUD_PROMETHEUS_URL"
          sync_secret "GRAFANA_CLOUD_PROMETHEUS_USERNAME" "$GRAFANA_CLOUD_PROMETHEUS_USERNAME"
          sync_secret "GRAFANA_CLOUD_ACCESS_POLICY_TOKEN" "$GRAFANA_CLOUD_ACCESS_POLICY_TOKEN"
          sync_secret "OLLAMA_CLOUD_RESET_ANCHOR_ISO" "$OLLAMA_CLOUD_RESET_ANCHOR_ISO"

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers
          command: deploy --config wrangler.ollama.jsonc

  deploy-provider-metrics-worker:
    name: Deploy Provider Metrics Worker
    runs-on: ubuntu-latest
    needs: validate-deployment
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json

      - name: Install Worker dependencies
        working-directory: workers
        run: npm ci --ignore-scripts

      - name: Sync Worker Secrets
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GRAFANA_CLOUD_PROMETHEUS_URL: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_URL || vars.GRAFANA_CLOUD_PROMETHEUS_URL }}
          GRAFANA_CLOUD_PROMETHEUS_USERNAME: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_USERNAME || vars.GRAFANA_CLOUD_PROMETHEUS_USERNAME }}
          GRAFANA_CLOUD_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_CLOUD_ACCESS_POLICY_TOKEN || secrets.GRAFANA_CLOUD_API_KEY }}
          OPENAI_ADMIN_API_KEY: ${{ secrets.OPENAI_ADMIN_API_KEY || secrets.OPENAI_API_KEY }}
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
          CODEX_ACCOUNT_ID: ${{ secrets.CODEX_ACCOUNT_ID || vars.CODEX_ACCOUNT_ID }}
          CODEX_PROXY_URL: ${{ secrets.CODEX_PROXY_URL || vars.CODEX_PROXY_URL }}
          OPENCODEGO_SESSION_COOKIE: ${{ secrets.OPENCODEGO_SESSION_COOKIE }}
          OPENCODEGO_WORKSPACE_ID: ${{ secrets.OPENCODEGO_WORKSPACE_ID || vars.OPENCODEGO_WORKSPACE_ID }}
        run: |
          set -e
          sync_secret() {
            local name="$1"
            local val="$2"
            if [[ -n "$val" ]]; then
              printf '%s' "$val" | npx wrangler secret put "$name" --config wrangler.provider-metrics.jsonc
            fi
          }
          sync_secret "GRAFANA_CLOUD_PROMETHEUS_URL" "$GRAFANA_CLOUD_PROMETHEUS_URL"
          sync_secret "GRAFANA_CLOUD_PROMETHEUS_USERNAME" "$GRAFANA_CLOUD_PROMETHEUS_USERNAME"
          sync_secret "GRAFANA_CLOUD_ACCESS_POLICY_TOKEN" "$GRAFANA_CLOUD_ACCESS_POLICY_TOKEN"
          sync_secret "OPENAI_ADMIN_API_KEY" "$OPENAI_ADMIN_API_KEY"
          sync_secret "CODEX_ACCESS_TOKEN" "$CODEX_ACCESS_TOKEN"
          sync_secret "CODEX_ACCOUNT_ID" "$CODEX_ACCOUNT_ID"
          sync_secret "CODEX_PROXY_URL" "$CODEX_PROXY_URL"
          sync_secret "OPENCODEGO_SESSION_COOKIE" "$OPENCODEGO_SESSION_COOKIE"
          sync_secret "OPENCODEGO_WORKSPACE_ID" "$OPENCODEGO_WORKSPACE_ID"

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers
          command: deploy --config wrangler.provider-metrics.jsonc

  deploy-grafana-dashboards:
    name: Deploy Grafana Dashboards
    runs-on: ubuntu-latest
    needs: validate-deployment
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Validate Grafana Cloud datasource UIDs
        env:
          GRAFANA_OTEL_PROMETHEUS_DATASOURCE_UID: ${{ vars.GRAFANA_OTEL_PROMETHEUS_DATASOURCE_UID }}
          GRAFANA_OTEL_LOKI_DATASOURCE_UID: ${{ vars.GRAFANA_OTEL_LOKI_DATASOURCE_UID }}
          GRAFANA_OTEL_TEMPO_DATASOURCE_UID: ${{ vars.GRAFANA_OTEL_TEMPO_DATASOURCE_UID }}
        run: |
          set -euo pipefail
          for name in GRAFANA_OTEL_PROMETHEUS_DATASOURCE_UID GRAFANA_OTEL_LOKI_DATASOURCE_UID GRAFANA_OTEL_TEMPO_DATASOURCE_UID; do
            if [[ -z "${!name}" ]]; then
              printf '%s\n' "Set ${name} as a production environment variable before deploying Grafana Cloud resources." >&2
              exit 1
            fi
          done

      - name: Deploy dashboards to Grafana Cloud
        env:
          GRAFANA_STACK_SLUG: ${{ vars.GRAFANA_STACK_SLUG }}
          GRAFANA_URL: ${{ vars.GRAFANA_URL || secrets.GRAFANA_URL }}
          GRAFANA_API_KEY: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN || secrets.GRAFANA_API_KEY || secrets.GRAFANA_CLOUD_API_KEY }}
          GRAFANA_OTEL_DATASOURCE_UIDS_REQUIRED: "true"
          GRAFANA_OTEL_PROMETHEUS_DATASOURCE_UID: ${{ vars.GRAFANA_OTEL_PROMETHEUS_DATASOURCE_UID }}
          GRAFANA_OTEL_LOKI_DATASOURCE_UID: ${{ vars.GRAFANA_OTEL_LOKI_DATASOURCE_UID }}
          GRAFANA_OTEL_TEMPO_DATASOURCE_UID: ${{ vars.GRAFANA_OTEL_TEMPO_DATASOURCE_UID }}
        run: node scripts/deploy-dashboards.mjs

      - name: Deploy alert rules to Grafana Cloud
        env:
          GRAFANA_STACK_SLUG: ${{ vars.GRAFANA_STACK_SLUG }}
          GRAFANA_URL: ${{ vars.GRAFANA_URL || secrets.GRAFANA_URL }}
          GRAFANA_API_KEY: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN || secrets.GRAFANA_API_KEY || secrets.GRAFANA_CLOUD_API_KEY }}
          GRAFANA_OTEL_DATASOURCE_UIDS_REQUIRED: "true"
          GRAFANA_OTEL_PROMETHEUS_DATASOURCE_UID: ${{ vars.GRAFANA_OTEL_PROMETHEUS_DATASOURCE_UID }}
          GRAFANA_OTEL_LOKI_DATASOURCE_UID: ${{ vars.GRAFANA_OTEL_LOKI_DATASOURCE_UID }}
          GRAFANA_OTEL_TEMPO_DATASOURCE_UID: ${{ vars.GRAFANA_OTEL_TEMPO_DATASOURCE_UID }}
        run: node scripts/deploy-alert-rules.mjs
