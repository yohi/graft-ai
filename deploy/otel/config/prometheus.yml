global:
  scrape_interval: 15s

storage:
  tsdb:
    out_of_order_time_window: 30m

# Prometheus 3.x: OTLP write receiver is enabled via --web.enable-otlp-receiver
# (the legacy --enable-feature=otlp-write-receiver flag was removed).
otlp:
  promote_resource_attributes:
    - service.name
    - service.version
  keep_identifying_resource_attributes: true
