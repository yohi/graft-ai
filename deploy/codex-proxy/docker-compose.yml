services:
  codex-proxy:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - PROXY_SECRET=${PROXY_SECRET}

  # オプション: Cloudflare Tunnel を Docker 経由で動かす場合
  # cloudflared:
