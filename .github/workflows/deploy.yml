name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-proxy-worker:
    name: Deploy Proxy Worker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json

      - name: Install Worker dependencies
        working-directory: workers
        run: npm ci --ignore-scripts

      - name: Validate proxy gateway configuration
        working-directory: workers
        run: |
          config_values="$(node <<'NODE'
          const { readFileSync } = require("node:fs");

          const input = readFileSync("wrangler.proxy.jsonc", "utf8");
          let withoutComments = "";
          let inString = false;
          let escaped = false;
          let inLineComment = false;
          let inBlockComment = false;

          for (let index = 0; index < input.length; index += 1) {
            const character = input[index];
            const next = input[index + 1];

            if (inLineComment) {
              if (character === "\n") {
                inLineComment = false;
                withoutComments += character;
              }
              continue;
            }

            if (inBlockComment) {
              if (character === "*" && next === "/") {
                inBlockComment = false;
                index += 1;
              } else if (character === "\n") {
                withoutComments += character;
              }
              continue;
            }

            if (!inString && character === "/" && next === "/") {
              inLineComment = true;
              index += 1;
              continue;
            }

            if (!inString && character === "/" && next === "*") {
              inBlockComment = true;
              index += 1;
              continue;
            }

            withoutComments += character;
            if (character === '"' && !escaped) {
              inString = !inString;
            }
            escaped = character === "\\" && !escaped;
            if (character !== "\\") {
              escaped = false;
            }
          }

          let normalized = "";
          inString = false;
          escaped = false;
          for (let index = 0; index < withoutComments.length; index += 1) {
            const character = withoutComments[index];
            if (character === '"' && !escaped) {
              inString = !inString;
            }

            if (!inString && character === ",") {
              let next = index + 1;
              while (/\s/.test(withoutComments[next] ?? "")) {
                next += 1;
              }
              if (withoutComments[next] === "}" || withoutComments[next] === "]") {
                escaped = false;
                continue;
              }
            }

            normalized += character;
            escaped = character === "\\" && !escaped;
            if (character !== "\\") {
              escaped = false;
            }
          }

          const config = JSON.parse(normalized);
          process.stdout.write(JSON.stringify({
            gateway_id: config?.vars?.AI_GATEWAY_ID ?? "",
            account_id: config?.vars?.CF_ACCOUNT_ID ?? "",
          }));
          NODE
          )"
          gateway_id="$(jq -r '.gateway_id' <<<"$config_values")"
          account_id="$(jq -r '.account_id' <<<"$config_values")"
          if [[ -z "$gateway_id" || "$gateway_id" == "replace-with-ai-gateway-id" ]]; then
            printf '%s\n' 'Set a real AI_GATEWAY_ID in workers/wrangler.proxy.jsonc before deploying.' >&2
            exit 1
          fi
          if [[ ! "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            printf '%s\n' 'Set a valid 32-character hex CF_ACCOUNT_ID in workers/wrangler.proxy.jsonc before deploying.' >&2
            exit 1
          fi

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers
          command: deploy --config wrangler.proxy.jsonc

  deploy-ollama-worker:
    name: Deploy Ollama Cloud Worker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json

      - name: Install Worker dependencies
        working-directory: workers
        run: npm ci --ignore-scripts

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers
          command: deploy --config wrangler.ollama.jsonc

  deploy-provider-metrics-worker:
    name: Deploy Provider Metrics Worker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json

      - name: Install Worker dependencies
        working-directory: workers
        run: npm ci --ignore-scripts

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers
          command: deploy --config wrangler.provider-metrics.jsonc
